<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kaliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FF00" />
      <stop offset="50%" stop-color="#F36E0F" />
      <stop offset="100%" stop-color="#EA0000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#0D0D2B" stroke="#F36E0F" stroke-width="4"/>
  <!-- Gaming controller crown motif -->
  <path d="M28 58 L28 44 Q28 32 50 32 Q72 32 72 44 L72 58 Q72 68 62 68 Q56 68 50 62 Q44 68 38 68 Q28 68 28 58 Z" fill="url(#kaliGrad)" filter="url(#glow)"/>
  <!-- D-pad cross -->
  <rect x="36" y="45" width="4" height="12" rx="2" fill="#0D0D2B" />
  <rect x="32" y="49" width="12" height="4" rx="2" fill="#0D0D2B" />
  <!-- Action buttons -->
  <circle cx="62" cy="48" r="2.5" fill="#0D0D2B" />
  <circle cx="66" cy="54" r="2.5" fill="#0D0D2B" />
  <!-- Center crown flame gem -->
  <polygon points="50,22 55,30 45,30" fill="#F6FF00" />
</svg>
